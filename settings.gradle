// This check must run before the `plugins` block resolves the foojay-resolver
// plugin; otherwise a user on an old JVM would wait for a plugin download before
// seeing the explanation of what is wrong.  Only `pluginManagement` and
// `buildscript` may precede the `plugins` block, and Gradle evaluates both of
// them first, so either would do; `pluginManagement` reads better next to the
// plugin that the check guards.
pluginManagement {
  if (JavaVersion.current() < JavaVersion.VERSION_21) {
    throw new GradleException("Use Java 21 or later.")
  }
}

plugins {
  // Apply the foojay-resolver plugin to allow automatic download of JDKs
  id("org.gradle.toolchains.foojay-resolver-convention").version("1.0.0")
}

// Project name is read-only in build scripts, and defaults to directory name.
rootProject.name = "merging"
