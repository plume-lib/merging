plugins {
  id("java")
  // Provides the `run` task and the start scripts.  This project contains
  // several merge drivers and merge tools, but they are all reached through a
  // single entry point, org.plumelib.merging.Main, which dispatches on its
  // first argument.
  id("application")

  // To create a fat jar build/libs/...-all.jar, run: ./gradlew shadowJar
  alias(libs.plugins.com.gradleup.shadow)

  // Code formatting; defines targets "spotlessApply" and "spotlessCheck"
  // which are run by "check" (which is itself run by "build").
  alias(libs.plugins.com.diffplug.spotless)

  // Error Prone linter
  alias(libs.plugins.net.ltgt.errorprone) apply false

  // PMD linter
  id("pmd")

  // code coverage
  id("jacoco")

  // Checker Framework pluggable type-checking
  alias(libs.plugins.org.checkerframework)

  // GraalVM native compilation
  alias(libs.plugins.org.graalvm.buildtools.native)
}

repositories {
  // The snapshot repositories are restricted to snapshots, so that a stale
  // artifact in one of them cannot shadow a release on Maven Central.  One
  // consequence is that a locally-installed *release* build of, say, plume-util
  // is ignored; install such a build as a snapshot to have this build use it.
  mavenLocal {
    mavenContent { snapshotsOnly() }
  }
  mavenCentral()
  maven {
    url = "https://central.sonatype.com/repository/maven-snapshots/"
    mavenContent { snapshotsOnly() }
  }
}

dependencies {
  implementation(libs.google.java.format)
  implementation(libs.javac.parse)
  implementation(libs.plume.util)

  annotationProcessor(libs.picocli.codegen)
  implementation(libs.picocli)

  testImplementation(libs.junit.jupiter)
  testRuntimeOnly(libs.junit.platform.launcher)
}

// This project (and google-java-format, which it uses) calls javac internals,
// which are not exported from the jdk.compiler module.  Every javac and JVM
// invocation therefore needs these packages exported.  Defining the list in one
// place keeps the invocations from drifting apart; exporting all six packages
// in an invocation that needs only some of them is harmless.  The shell scripts
// in src/main/sh contain a copy of this list.
def javacInternalPackages = ["api", "code", "file", "parser", "tree", "util"]
def javacExportTargets = javacInternalPackages.collect {
  "jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()
}
def addExportsArgs = javacExportTargets.collect { "--add-exports=${it}".toString() }
def addOpensArgs = javacExportTargets.collect { "--add-opens=${it}".toString() }

java {
  toolchain {
    // Always compile using Java 21.  The "test" task below overrides this for
    // test execution, so that tests run under various Java versions.
    languageVersion = JavaLanguageVersion.of(21)
  }
}
// Don't use --release because it is incompatible with --add-exports.
// When making a release, it is essential to use the lowest possible Java version.
// tasks.withType(JavaCompile).configureEach {
//   // Set the language level and byte code to 21.
//   options.release = 21
// }

tasks.named("compileJava") {
  options.compilerArgs += addExportsArgs
  //   // For Picocli native image
  //   options.compilerArgs += [
  //     "-Aproject=${project.group}/${project.name}"
  //   ]
}
tasks.named("compileTestJava") {
  options.compilerArgs += addExportsArgs
}

// The Java version under which to run the tests -- both the JUnit tests and the
// tests in src/test/resources/Makefile, which must agree so that a single
// -PtestJavaVersion controls both.  The default is the Java version that is
// running the Gradle daemon, rather than the Java 21 toolchain that is used for
// compilation.  This is what makes the Java version matrix in
// .github/workflows/gradle.yml test multiple Java versions.  Note that the
// Gradle daemon's JVM is not necessarily the `java` on the user's PATH;
// `org.gradle.java.home` overrides it.  Gradle downloads the requested JDK if it
// is not already installed.
//
// `settings.gradle` requires Gradle itself to run under Java 21 or later, so
// only -PtestJavaVersion can supply a value that the checks below reject.  Make
// those checks explicit: otherwise -PtestJavaVersion=17 fails much later, as an
// UnsupportedClassVersionError buried in the output of the "test" task, and a
// non-numeric value fails as a bare NumberFormatException that does not name
// the property.
def testJavaVersionProperty = project.findProperty("testJavaVersion")?.toString()
def testJavaVersion
try {
  testJavaVersion = Integer.parseInt(
      testJavaVersionProperty ?: System.getProperty("java.specification.version"))
} catch (NumberFormatException e) {
  throw new GradleException(
      "-PtestJavaVersion must be an integer, but is \"${testJavaVersionProperty}\".")
}
if (testJavaVersion < 21) {
  throw new GradleException("-PtestJavaVersion must be 21 or later, but is ${testJavaVersion}."
      + "  The code is compiled under Java 21, whose class files an earlier JVM cannot read.")
}

tasks.named("test") {
  // Use JUnit Platform for unit tests.
  useJUnitPlatform()

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(testJavaVersion)
  }

  jvmArgs(addExportsArgs)

  // This task is up-to-date-checked in the ordinary way: a repeated `./gradlew
  // test` reports "UP-TO-DATE", runs no test, and therefore prints none of the
  // output that `testLogging` requests below.  Run `./gradlew test --rerun` to
  // run the tests again without changing the code.
  testLogging {
    // TODO: What about "ignored"?  There is no such event: https://docs.gradle.org/current/javadoc/org/gradle/api/tasks/testing/logging/TestLogEvent.html
    // The "standardOut" and "standardError" events are what makes the tests'
    // standard output and error visible; `showStandardStreams = true` would be
    // a redundant way to request the same thing.
    // Note that "passed" and "skipped" make this noisier than the previous
    // configuration, whose second `testLogging` block overwrote the first
    // block's event list with just "failed".
    events("passed", "skipped", "failed", "standardOut", "standardError")
    exceptionFormat = "full"
  }

  // Two possible configurations:
  // Configuration A: report is always generated after tests run.
  finalizedBy(tasks.named("jacocoTestReport"))
  // Configuration B: user must run `jacocoTestReport` explicitly.
  // (Give jacocoTestReport a dependsOn(test) instead of this finalizedBy.)
}

tasks.register("runMakefileTests", Exec) {
  description = "Run tests defined in Makefile."
  group = "verification"
  // The Makefile's tests run the shell scripts in src/main/sh, which use either
  // the fat jar or the native executable.
  dependsOn(tasks.named("shadowJar"))
  // Testing the native executable is opt-in, via -PtestNative, because building
  // it takes minutes.  Do not instead test whether the native executable
  // already exists: that would make the task graph depend on the results of
  // previous builds, so that `./gradlew check` behaves differently on a clean
  // checkout than on a tree where someone once ran `nativeCompile`.
  def testNative = project.hasProperty("testNative")
  if (testNative) {
    dependsOn(tasks.named("nativeCompile"))
  }
  // This task declares no inputs or outputs, so Gradle always runs it and never
  // caches it.  That is intentional: the Makefile's rules do not create the
  // files that name them, so the Makefile has no reliable up-to-date check of
  // its own for Gradle to defer to.
  //
  // Tell the shell scripts which artifact to run, rather than letting them
  // choose by probing for a native executable in its default location.  Without
  // this, an executable left behind by an earlier `nativeCompile` would be
  // tested in place of the fat jar that this task just built -- so `./gradlew
  // check` would silently test stale code and still pass.  Ask "nativeCompile"
  // for its output file rather than hard-coding the path, which would go stale
  // if `imageName` or the plugin's output directory changed.
  def nativeExecutable = testNative
      ? tasks.named("nativeCompile").flatMap { it.outputFile }.map { it.asFile.absolutePath }
      : project.providers.provider { "" }
  // Without PLUMELIB_MERGE_EXECUTABLE naming a native executable, the shell
  // scripts run the fat jar under a Java installation.  Name that installation
  // explicitly, so that the tests do not depend on whether the developer's
  // environment happens to define JAVA_HOME or JAVA21_HOME.  Overriding
  // JAVA_HOME would not suffice: an `Exec` task inherits the parent process's
  // environment, and the shell scripts prefer JAVA21_HOME over JAVA_HOME
  // whenever the two differ, so a stray JAVA21_HOME would still win.
  def makefileJavaHome = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(testJavaVersion)
  }.map { it.metadata.installationPath.asFile.absolutePath }
  // Set the environment in `doFirst`, so that merely configuring this task
  // neither provisions a JDK nor forces "nativeCompile" to be configured.
  doFirst {
    environment("PLUMELIB_MERGE_EXECUTABLE", nativeExecutable.get())
    environment("PLUMELIB_MERGE_JAVA_HOME", makefileJavaHome.get())
  }
  // SKIP_GRADLE tells the Makefile not to build the artifacts itself.  Gradle
  // has already built them, per the dependencies above, and a nested Gradle
  // invocation from within a running Gradle build contends for Gradle's locks.
  commandLine("make", "-C", file("src/test/resources").absolutePath, "SKIP_GRADLE=1")
  // The "test" task runs the JUnit tests, whose failure is more informative than system tests.
  mustRunAfter(tasks.named("test"))
  // Under -PtestNative, "nativeCompile" is a dependency, so it is already
  // ordered first.  This ordering additionally covers a command line that names
  // both tasks, such as `./gradlew nativeCompile check`.
  mustRunAfter(tasks.named("nativeCompile"))
}
tasks.named("check") {
  dependsOn(tasks.named("runMakefileTests"))
}

tasks.named("jacocoTestReport") {
  reports {
    xml.required = false
    csv.required = true // Output is written to build/reports/jacoco/test/jacocoTestReport.csv
    html.required = true // Output is written to build/reports/jacoco/test/html/index.html
  }
}

spotless {
  format("misc") {
    // define the files to apply `misc` to
    target("**/*.md", ".gitignore")
    // src/test/resources holds merge test inputs and expected outputs.
    // Reformatting those files would corrupt the tests.
    targetExclude("build/**", ".gradle/**", "src/test/resources/**")

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces(2)
    endWithNewline()
  }
  java {
    targetExclude("**/diff_match_patch.java")
    googleJavaFormat()
    formatAnnotations()
  }
  // Formatting of .gradle files is opt-in, via -PformatGradleFiles, because
  // eclipse.org flakiness leads to "Failed to provision P2 dependencies".
  if (project.hasProperty("formatGradleFiles")) {
    groovyGradle {
      target("**/*.gradle")
      greclipse()  // which formatter Spotless should use to format .gradle files.
      leadingTabsToSpaces(2)
      trimTrailingWhitespace()
      // endWithNewline() // Don't want to end empty files with a newline
    }
  }
}

application {
  mainClass = "org.plumelib.merging.Main"
}

graalvmNative {
  binaries {
    main {
      imageName = "plumelib-merge"
      mainClass = application.mainClass
      buildArgs.add("-O4")
    }
    test {
      buildArgs.add("-O0")
    }
  }
  binaries.all {
    buildArgs.add("--verbose")
    // These arguments are from google-java-format's core/pom.xml.
    buildArgs.add("-H:+UnlockExperimentalVMOptions")
    buildArgs.add("-H:IncludeResourceBundles=com.sun.tools.javac.resources.compiler")
    buildArgs.add("-H:IncludeResourceBundles=com.sun.tools.javac.resources.javac")
    buildArgs.add("--no-fallback")
    buildArgs.add("--initialize-at-build-time=com.sun.tools.javac.file.Locations")
    buildArgs.add("-H:+ReportExceptionStackTraces")
    buildArgs.add("-H:-UseContainerSupport")
    addExportsArgs.each { buildArgs.add("-J${it}".toString()) }
    buildArgs.add("-march=compatibility")
  }
}

// Error Prone linter

tasks.withType(JavaCompile).configureEach {
  options.forkOptions.jvmArgs += "-Xmx6g"
  options.compilerArgs << "-Werror"
  // "-processing" avoids javac warning "No processor claimed any of these annotations".
  options.compilerArgs << "-Xlint:all,-processing,-this-escape"
}
apply plugin: "net.ltgt.errorprone"
dependencies {
  errorprone(libs.error.prone.core)
}
tasks.withType(JavaCompile).configureEach {
  options.errorprone {
    disable("AnnotateFormatMethod") // Error Prone doesn't know about Checker Framework @FormatMethod.
    disable("DoNotCallSuggester") // Suggests use of an Error Prone annotation.
    disable("EffectivelyPrivate") // Loses information about the abstraction.
    disable("ExtendsObject")  // Incorrect when using the Checker Framework.
    disable("InlineMeSuggester") // Using `@InlineMe` requires clients to declare a dependency on error_prone_annotations.
    disable("ReferenceEquality") // Use Interning Checker instead.
    // Don't complain about external library (which is included as source because it isn't at Maven Central).
    excludedPaths = ".*/diff_match_patch.java"
  }
}


// PMD linter

pmd {
  toolVersion = libs.versions.pmd.get()
  ruleSetFiles = files("${rootDir}/.pmd-ruleset.xml")
  consoleOutput = true
  ignoreFailures = false
  incrementalAnalysis = true
}
tasks.named("pmdTest") {
  enabled = false
}


// Checker Framework pluggable type-checking

apply plugin: "org.checkerframework"

checkerFramework {
  version = libs.checker.framework.get().version
  checkers = [
    // No need to run CalledMethodsChecker, because ResourceLeakChecker does so.
    // "org.checkerframework.checker.calledmethods.CalledMethodsChecker",
    "org.checkerframework.checker.formatter.FormatterChecker",
    // Passing the Index Checker should be possible; reinstate this when I have time to do so.
    // "org.checkerframework.checker.index.IndexChecker",
    "org.checkerframework.checker.interning.InterningChecker",
    "org.checkerframework.checker.lock.LockChecker",
    "org.checkerframework.checker.nullness.NullnessChecker",
    "org.checkerframework.checker.regex.RegexChecker",
    "org.checkerframework.checker.resourceleak.ResourceLeakChecker",
    "org.checkerframework.checker.signature.SignatureChecker",
    "org.checkerframework.checker.signedness.SignednessChecker",
    "org.checkerframework.common.initializedfields.InitializedFieldsChecker",
  ]
  extraJavacArgs = [
    "-Werror",
    // "-Aversion",
    // "-verbose",
    "-AcheckPurityAnnotations",
    "-ArequirePrefixInWarningSuppressions",
    "-AwarnRedundantAnnotations",
    "-AwarnUnneededSuppressions",
    "-AskipDefs=.*\\.diff_match_patch",
  ]
}


// Javadoc

tasks.withType(Javadoc).configureEach {
  options.noTimestamp = true
  // Buggy per https://github.com/java9-modularity/gradle-modules-plugin/issues/170
  // moduleOptions {
  //   addExports = [
  //     "jdk.compiler/com.sun.tools.javac.parser" : "ALL-UNNAMED",
  //     "jdk.compiler/com.sun.tools.javac.tree" : " ALL-UNNAMED" ,
  //     "jdk.compiler/com.sun.tools.javac.util':"ALL-UNNAMED"
  //   ]
  // }
  // Workaround until bug is fixed.
  options {
    addMultilineStringsOption("-add-exports").setValue(javacExportTargets)
  }
  doLast {
    // Javadoc emits `@import url('resources/fonts/dejavu.css');` into
    // stylesheet.css, but generates no resources/fonts directory, so the import
    // is a dangling reference.  Remove it.  This is written with plain file I/O
    // rather than `ant.replaceregexp` because reading `ant` at execution time
    // requires the Project object, which the configuration cache forbids.
    // The trailing `[ \t]*\R?` matches only to the end of the line, as
    // `ant.replaceregexp`'s `byline` did; a plain `\s*` would also consume any
    // blank lines that follow the import.
    def dejavuImport = ~/@import url\('resources\/fonts\/dejavu\.css'\);[ \t]*\R?/
    // Only stylesheets contain the import.
    destinationDir.eachFileRecurse { file ->
      if (file.isFile() && file.name.endsWith(".css")) {
        def original = file.getText("UTF-8")
        def stripped = original.replaceAll(dejavuImport, "")
        if (stripped != original) {
          file.setText(stripped, "UTF-8")
        }
      }
    }
  }
}
tasks.named("javadoc") {
  // Turn Javadoc warnings into errors.
  options.addStringOption("Xwerror", "-Xdoclint:all")
  options.addStringOption("private", "-quiet")
}
tasks.named("check") {
  dependsOn(tasks.named("javadoc"))
}

tasks.register("javadocWebUpload", Javadoc) {
  description = "Generate API documentation into the website directory."
  group = "documentation"
  source = sourceSets.main.allJava
  destinationDir = file("/cse/web/research/plumelib/${project.name}/api")
  classpath = project.sourceSets.main.compileClasspath
}
// Set permissions
tasks.register("javadocWebChgrp", Exec) {
  description = "Set the Unix group of the uploaded API documentation."
  group = "documentation"
  commandLine("chgrp", "-R",  "plse_www", "/cse/web/research/plumelib/${project.name}/api")
  ignoreExitValue = true
  mustRunAfter(tasks.named("javadocWebUpload"))
  doLast {
    int exitValue = executionResult.get().exitValue
    if (exitValue != 0) {
      logger.warn("chgrp of the uploaded API documentation exited with status ${exitValue}.")
    }
  }
}
tasks.register("javadocWebChmod", Exec) {
  description = "Set the Unix permissions of the uploaded API documentation."
  group = "documentation"
  commandLine("chmod", "-R",  "g+w", "/cse/web/research/plumelib/${project.name}/api")
  ignoreExitValue = true
  mustRunAfter(tasks.named("javadocWebUpload"))
  doLast {
    int exitValue = executionResult.get().exitValue
    if (exitValue != 0) {
      logger.warn("chmod of the uploaded API documentation exited with status ${exitValue}.")
    }
  }
}
tasks.register("javadocWeb", DefaultTask) {
  description = "Upload API documentation to website."
  group = "documentation"
  dependsOn(
      tasks.named("javadocWebUpload"),
      tasks.named("javadocWebChgrp"),
      tasks.named("javadocWebChmod"))
}


configurations {
  requireJavadoc
}
dependencies {
  requireJavadoc(libs.require.javadoc)
}
tasks.register("requireJavadoc", JavaExec) {
  group = "documentation"
  description = "Ensures that Javadoc documentation exists."
  inputs.files(sourceSets.main.allJava)
  mainClass = "org.plumelib.javadoc.RequireJavadoc"
  classpath = configurations.requireJavadoc
  args(sourceSets.main.allJava.srcDirs.collect{it.getAbsolutePath()})
  jvmArgs += addExportsArgs
  jvmArgs += addOpensArgs
}
tasks.named("check") {
  dependsOn(tasks.named("requireJavadoc"))
}

// Emacs support

/* Make Emacs TAGS table */
tasks.register("tags", Exec) {
  description = "Run etags to create an Emacs TAGS table"
  group = "build"
  commandLine("bash", "-c", "find src/ \\( -name '*.java' -o -name '*.sh' \\) | sort | xargs etags")
}
