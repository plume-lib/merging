[versions]

checker-framework = "4.2.1"

# build.gradle uses this both as a dependency version and as the
# google-java-format version for Spotless.
google-java-format = "1.33.0"

junit-jupiter = "6.1.2"

# Not a dependency; build.gradle uses this as the Groovy-Eclipse version for
# Spotless. The version is an Eclipse release, not a Groovy-Eclipse release.
greclipse = "4.36"

# Not a dependency; build.gradle uses this as the PMD toolVersion.
pmd = "7.26.0"

[libraries]

checker-framework = { module = "org.checkerframework:checker", version.ref = "checker-framework" }

error-prone-core = "com.google.errorprone:error_prone_core:2.50.0"

google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }

javac-parse = "org.plumelib:javac-parse:1.0.0-SNAPSHOT"

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }

junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-jupiter" }

picocli = "info.picocli:picocli:4.7.7"

picocli-codegen = "info.picocli:picocli-codegen:4.7.7"

plume-util = "org.plumelib:plume-util:2.0.0-SNAPSHOT"

require-javadoc = "org.plumelib:require-javadoc:3.0.0-SNAPSHOT"

[plugins]

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.9.0" }

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

org-checkerframework = { id = "org.checkerframework", version = "1.0.2" }

org-graalvm-buildtools-native = { id = "org.graalvm.buildtools.native", version = "1.1.6" }
