[versions]

checker-framework = "4.2.2"

# build.gradle.kts uses this both as a dependency version and as the google-java-format version for
# Spotless, so that this project is formatted by the same version that it calls.
google-java-format = "1.33.0"

jacoco = "0.8.15"

# The formatter that Spotless applies to .gradle.kts files.
ktfmt = "0.63"

junit-jupiter = "6.1.3"

picocli = "4.7.7"

pmd = "7.26.0"

[libraries]

# Some entries below are not dependencies.  Each such entry exists so that a dependency-update tool
# such as Renovate proposes new versions of a tool whose version build.gradle.kts reads, by itself,
# via "libs.versions.*".  Each such entry is marked "Version only".

# Version only:  the org.checkerframework Gradle plugin adds the dependency, from
# `checkerFramework.version`.
checker-framework = { module = "org.checkerframework:checker", version.ref = "checker-framework" }

error-prone-core = { module = "com.google.errorprone:error_prone_core", version = "2.50.0" }

google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }

# Version only:  for the JaCoCo plugin's `toolVersion`.
jacoco = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }

javac-parse = { module = "org.plumelib:javac-parse", version = "1.0.0" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-jupiter" }

# Version only:  for Spotless's `ktfmt` step.
ktfmt = { module = "com.facebook:ktfmt", version.ref = "ktfmt" }

picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

plume-util = { module = "org.plumelib:plume-util", version = "2.0.0" }

# Version only:  for the PMD plugin's `toolVersion`.
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }

require-javadoc = { module = "org.plumelib:require-javadoc", version = "3.0.0" }

[plugins]

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.9.0" }

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

org-checkerframework = { id = "org.checkerframework", version = "1.0.2" }

org-graalvm-buildtools-native = { id = "org.graalvm.buildtools.native", version = "1.1.7" }
