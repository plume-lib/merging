org.gradle.jvmargs=-Xmx6g

# The Checker Framework and Error Prone compilations are expensive, so reusing
# their outputs is worthwhile.
org.gradle.caching=true

# The configuration cache is not enabled, because the Checker Framework Gradle
# plugin (org.checkerframework 1.0.2) stores a Project reference in the
# JavaCompile tasks, which the configuration cache forbids.  To check whether
# that has been fixed, run:  ./gradlew build --configuration-cache
# Everything else in this build is configuration-cache compatible, as
# `./gradlew build --configuration-cache -PskipCheckerFramework=true` shows.
# org.gradle.configuration-cache=true
