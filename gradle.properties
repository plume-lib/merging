# "-DlockFileGenerousTimeout" concerns the lock file that guards the Groovy-Eclipse formatter's P2
# cache, whose location build.gradle sets.  Solstice, which provisions that cache for Spotless,
# waits 5 seconds for a lock that another process holds, but provisioning an empty cache takes
# about 30 seconds; a second Gradle process therefore gives up and fails with "Failed to provision
# P2 dependencies".  This property, whose value Solstice ignores, raises the wait to 50 seconds,
# which is long enough.  Two Gradle processes run at once whenever the "gradle-spotless-gradle"
# hook in prek.toml runs "./gradlew spotlessGroovyGradleApply" during a commit while a build is
# already running.
org.gradle.jvmargs=-Xmx6g -DlockFileGenerousTimeout

# Reuse task outputs -- notably the expensive Checker Framework and Error Prone compilations --
# across builds and across continuous integration runs.  The "test" task opts out; see build.gradle.
org.gradle.caching=true

# The configuration cache is not enabled, because the Checker Framework Gradle plugin
# (org.checkerframework 1.0.2) stores a Project reference in a JavaCompile task action, which the
# configuration cache cannot serialize.  To check whether that has been fixed, run:
#   ./gradlew build --configuration-cache
# Everything else in this build is configuration-cache compatible, as
# `./gradlew build --configuration-cache -PskipCheckerFramework` shows.
# org.gradle.configuration-cache=true
