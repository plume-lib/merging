org.gradle.jvmargs=-Xmx6g

# Reuse task outputs -- notably the expensive Checker Framework and Error Prone compilations --
# across builds and across continuous integration runs.  The "test" task opts out; see build.gradle.
org.gradle.caching=true

# The configuration cache is not enabled, because the Checker Framework Gradle plugin
# (org.checkerframework 1.0.2) stores a Project reference in a JavaCompile task action, which the
# configuration cache cannot serialize.  To check whether that has been fixed, run:
#   ./gradlew build --configuration-cache
# Everything else in this build is configuration-cache compatible, as
# `./gradlew build --configuration-cache -PskipCheckerFramework` shows.
# org.gradle.configuration-cache=true
