name: Download Groovy-Eclipse for Spotless
description: >-
  Downloads the Groovy-Eclipse formatter that Spotless uses, caching it across
  runs and retrying if download.eclipse.org is unavailable.

# Spotless downloads Groovy-Eclipse from the P2 repository at
# download.eclipse.org rather than from Maven Central.  Without this action,
# every run contacts download.eclipse.org, whose flakiness then fails the build
# with "Failed to provision P2 dependencies".

inputs:
  save-cache:
    description: >-
      Whether to save the download to the cache.  Every job of a matrix downloads
      the same data under the same key, so set this to true in exactly one of
      them; in the others the save would lose a race and log "Cache save failed".
    default: "true"

runs:
  using: composite
  steps:
    # Key the cache on the Groovy-Eclipse version alone.  Hashing build.gradle
    # instead would miss on nearly every commit, because build.gradle changes far
    # more often than the formatter does.
    - name: Locate Spotless's Groovy-Eclipse download
      id: p2
      shell: bash
      run: |
        version=$(sed -n 's/^greclipse = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        if [ -z "$version" ]; then
          echo "Found no 'greclipse' version in gradle/libs.versions.toml." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dir=${GRADLE_USER_HOME:-$HOME/.gradle}/spotless-p2" >> "$GITHUB_OUTPUT"

    # No "restore-keys".  A prefix match would restore some other version's
    # download, which does not avoid downloading the version that is wanted, and
    # which would then be saved alongside it -- so the cache would accumulate
    # every version ever used.  An exact-match-only cache holds one version and
    # misses only just after the version changes.
    - name: Restore Spotless's Groovy-Eclipse download
      id: p2-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.p2.outputs.dir }}
        key: p2-data-${{ runner.os }}-greclipse-${{ steps.p2.outputs.version }}

    - name: Download Groovy-Eclipse for Spotless
      if: steps.p2-cache.outputs.cache-hit != 'true'
      shell: bash
      run: .github/scripts/provision-spotless-p2.sh

    # Not "actions/cache", because that saves even if a later step fails.  The
    # download is worth saving only if it succeeded, and the preceding step fails
    # if it did not.  This step does not run in that case, because a step runs by
    # default only if all preceding steps succeeded.
    - name: Save Spotless's Groovy-Eclipse download
      if: inputs.save-cache == 'true' && steps.p2-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.p2.outputs.dir }}
        key: p2-data-${{ runner.os }}-greclipse-${{ steps.p2.outputs.version }}
