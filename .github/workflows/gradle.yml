name: Java CI with Gradle

"on": [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['21', '25', '26']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: 'gradle'
      - name: java -version
        run: java -version
      - name: Download Groovy-Eclipse for Spotless
        uses: ./.github/actions/spotless-p2
        with:
          # Every leg of the matrix downloads the same data; let one leg save it.
          save-cache: ${{ matrix.java == '21' }}
      - name: ./gradlew build
        run: ./gradlew build
