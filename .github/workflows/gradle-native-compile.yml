# Distinct from the name in gradle.yml, so that the two workflows' checks can be
# told apart in the pull request UI; they run different commands.
name: Java CI with Gradle, native

"on": [push, pull_request]

jobs:
  native-build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # On GitHub Actions, GraalVM is not available for Java 26, as of 2026-06-05.
        # Java 21 is excluded:  google-java-format ships its Native Image
        # registrations in META-INF/native-image/reachability-metadata.json, the
        # unified format that native-image reads only in GraalVM for JDK 23 and
        # later.  Under GraalVM for JDK 21 those registrations are ignored, so the
        # javac members that google-java-format looks up via MethodHandles are
        # absent from the image and the executable dies with
        # "LinkageError: no such method JCTree.getEndPosition(EndPosTable)".
        java: ['25']

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - name: Set up JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      # -PtestNative makes `check` build the native executable and makes the
      # Makefile tests run that executable rather than the fat jar.
      # The "spotless" job in gradle.yml performs the formatting checks, which do not depend on the
      # Java version, so running them here too would be wasted work.
      - name: ./gradlew check -PtestNative
        run: ./gradlew check -PtestNative -x spotlessCheck
