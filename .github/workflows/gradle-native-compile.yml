# Distinct from the name in gradle.yml, so that the two workflows' checks can be
# told apart in the pull request UI; they run different commands.
name: Java CI with Gradle, native

"on": [push, pull_request]

jobs:
  native-build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # On GitHub Actions, GraalVM is not available for Java 26, as of 2026-06-05.
        java: ['21', '25']

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Set up JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      # -PtestNative makes `check` build the native executable and makes the
      # Makefile tests run that executable rather than the fat jar.
      - name: ./gradlew check -PtestNative
        run: ./gradlew check -PtestNative
