name: Prek checks
"on": [push, pull_request]
jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      # A hook in prek.toml runs Spotless's Groovy-Eclipse formatter when a .gradle file changes.
      # Restoring the cache that the "spotless" job of gradle.yml saves lets that hook run without
      # downloading from the Eclipse P2 repositories, which fails often.  This job never saves the
      # cache, because most runs of this job do not populate it.
      #
      # The key is a bare prefix that matches no entry exactly, so the restore always falls through
      # to "restore-keys" and accepts whatever the "spotless" job saved most recently.  That is
      # deliberate:  it avoids repeating that job's version-derived key here, where it would be a
      # second copy to keep in step.  An entry for another formatter version costs nothing, because
      # Solstice downloads whatever the restored directory lacks.
      #
      # The directory, unlike the key, must match Spotless's default P2 cache directory, which is
      # "caches/p2-data" within the Gradle user home directory.  Derive it the way Gradle resolves
      # `gradle.gradleUserHomeDir` rather than writing "~/.gradle" and assuming that nothing sets
      # GRADLE_USER_HOME.  Restoring some other directory would fail silently, as a run that
      # downloads the whole formatter again.
      - name: Compute the Spotless P2 cache directory
        id: spotless-p2-dir
        run: |
          set -eu
          echo "dir=${GRADLE_USER_HOME:-$HOME/.gradle}/caches/p2-data" >> "$GITHUB_OUTPUT"
      - name: Restore Spotless P2 cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.spotless-p2-dir.outputs.dir }}
          key: spotless-p2-${{ runner.os }}-
          restore-keys: spotless-p2-${{ runner.os }}-
      # A restored entry can carry a lock file that Solstice left behind; see the step of the same
      # name in gradle.yml.
      - name: Delete any restored Spotless P2 lock file
        run: rm -f ~/.gradle/caches/p2-data/metadata/.lock
      - uses: j178/prek-action@v3.0.0
