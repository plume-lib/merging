name: Claude Code Review

# Use "pull_request_target:" rather than "pull_request:".  GitHub withholds
# secrets and downgrades the GITHUB_TOKEN to read-only for "pull_request:" runs
# that originate from a fork, so the action cannot obtain an OIDC token and has
# no API key.  "pull_request_target:" runs in the context of the base
# repository, which has both.
"on":
  pull_request_target:
    # "synchronize" runs a fresh review on every push to a pull request.  That
    # is intentional -- a review of superseded code is not useful -- but it
    # means that a pull request with many pushes costs many reviews.
    types: [opened, synchronize, ready_for_review, reopened]

# A push to a pull request supersedes any review that is still running for that
# same pull request, so cancel it rather than pay for a review of stale code.
# The group is per pull request, so that reviews of different pull requests still
# run concurrently.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # "pull_request_target:" exposes the base repository's secrets to a job that
    # examines pull request code, so run only for trusted authors.
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Claude cannot push or merge; it can only comment.
      # To post the review.  Unlike a "pull_request:" run from a fork, which
      # GitHub gives a read-only token no matter what this block requests, a
      # "pull_request_target:" run gets the write access requested here, because
      # the job runs in the context of the base repository.
      pull-requests: write
      issues: read
      actions: read # Required for Claude to read CI results on PRs
      # Deliberately no "id-token: write".  That permission exists only to obtain
      # an OIDC token for the exchange described at "github_token" below, and
      # supplying "github_token" skips the exchange, so nothing here requests an
      # OIDC token.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # "pull_request_target:" checks out the base branch by default; check
          # out the pull request's code instead, which is what is under review.
          ref: ${{ github.event.pull_request.head.sha }}
          # Do not write this job's token into .git/config.  This checkout holds
          # code from the pull request, and under "pull_request_target:" the
          # token can write to the base repository.  The action does not need
          # the token to be in .git/config; it receives one through the
          # "github_token" input below.
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # This is the credential for Anthropic's API.  Do not also supply
          # "anthropic_api_key"; the action accepts either one, and supplying
          # both leaves it unclear which one is in use.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Pass a GitHub token explicitly.  Otherwise the action trades the
          # workflow's OIDC token for a Claude GitHub App token, and Anthropic's
          # exchange endpoint rejects OIDC tokens whose "event_name" claim is
          # "pull_request_target", failing with "401 Unauthorized - Invalid OIDC
          # token".  (See anthropics/claude-code-action issue 713.)  Supplying
          # "github_token" skips the exchange.  A consequence is that review
          # comments come from "github-actions[bot]" rather than "claude[bot]".
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Supplying "prompt" is what makes this workflow review every pull
          # request as soon as it runs: the action treats a prompt as an
          # unconditional trigger.  Without "prompt", the action does nothing
          # until someone writes "@claude" in a comment, and reports "No trigger
          # found, skipping remaining steps".
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.

            Report specific problems as inline comments.  Use a top-level
            comment for general observations.  Do not restate what the diff
            does, and do not raise stylistic preferences that the repository's
            linters already enforce.

          # Tools for PR review.
          # Beyond Claude's default tools, allow posting inline comments on a
          # pull request and querying pull requests with the `gh` command.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr *)"
